<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>BuildWithIF UI Playground</title>

    <link rel="stylesheet" href="../../assets/css/tokens.css">
    <link rel="stylesheet" href="../../assets/css/base.css">

    <link rel="stylesheet" href="../Button/button.css">

    <link rel="stylesheet" href="playground.css">

</head>

<body>

<div class="playground">

    <header class="playground-header">

        <h1>BuildWithIF UI</h1>

        <p>Component Library</p>

    </header>


    <section class="playground-section">

        <h2>Buttons</h2>

        <div class="component-preview">

            <button class="bw-btn bw-btn--primary">
                Primary
            </button>

            <button class="bw-btn bw-btn--secondary">
                Secondary
            </button>

            <button class="bw-btn bw-btn--success">
                Success
            </button>

            <button class="bw-btn bw-btn--danger">
                Danger
            </button>

            <button class="bw-btn bw-btn--ghost">
                Ghost
            </button>

        </div>

    </section>

</div>

<script src="playground.js"></script>

</body>

</html>
