server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    # Keep redirect Location headers relative (host:port is preserved for
    # setups served on a mapped port, e.g. localhost:8080 -> :80).
    absolute_redirect off;

    # Serve admin panel at /admin (SPA fallback)
    location /admin {
        try_files $uri $uri/ /admin/index.html;
    }

    # Static site pages and assets
    location / {
        try_files $uri $uri/ =404;
    }

    # Code and markup change often during development — always revalidate
    location ~* \.(css|js|html)$ {
        add_header Cache-Control "no-cache";
    }

    # Cache static assets
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
